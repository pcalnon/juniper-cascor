---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCascor
# Application:   juniper_cascor
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.4.1
#
# Date Created:  2026-01-24
# Last Modified: 2026-01-29
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI/CD Pipeline for Juniper Cascor Cascade Correlation Neural Network
#    - Pre-commit hooks for code quality (black, isort, flake8, mypy, bandit)
#    - Unit tests with coverage enforcement
#    - Integration tests
#    - Security scanning (Gitleaks, Bandit SARIF, pip-audit)
#    - Proper failure handling (no continue-on-error for critical steps)
#    - Dependency caching for performance
#
# References:
#    - CASCOR-P1-007: CI/CD Pipeline Setup
#    - CASCOR-P2-002: CI Coverage Gates
#    - Best practices: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#####################################################################################################################################################################################################

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop
  repository_dispatch:
    types: [data-client-updated, cascor-worker-updated]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENV_NAME: JuniperCascor
  PYTHON_TEST_VERSION: "3.14"
  COVERAGE_FAIL_UNDER: "80"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks (runs across multiple Python versions)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        env:
          # Skip local test hooks in CI: they require local conda env.
          # Coverage is enforced by the dedicated unit-tests job with proper conda setup.
          SKIP: pytest-unit,coverage-gate
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo "Note: pytest-unit and coverage-gate hooks skipped in CI"
          echo "      (handled by dedicated unit-tests job with full environment)"
          pre-commit run --all-files --show-diff-on-failure

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docs: Validate documentation link integrity
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      # Wave 2 of the doc-link migration plan
      # (juniper-ml notes/JUNIPER_DOC_TOOLS_PYPI_MIGRATION_PLAN_2026-05-18.md):
      # the validator is installed from PyPI instead of run from the
      # inline scripts/check_doc_links.py copy. The inline copy stays in
      # place through Wave 4 so this swap remains a one-line revert.
      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0" "pyyaml>=6.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Documentation Link Validation       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-check-doc-links \
            --exclude templates \
            --exclude history \
            --exclude legacy \
            --exclude pull_requests \
            --exclude releases \
            --exclude analysis \
            --exclude fixes \
            --exclude development \
            --exclude CHANGELOG.md \
            --cross-repo skip

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. Wave 4 of the dep-docs PyPI
      # migration (juniper-ml notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md)
      # ships this lint as the ``juniper-lint-workflow-paths`` console
      # script in ``juniper-ci-tools>=0.2.0``; the inline byte-identical
      # copy at ``util/test_workflow_script_paths.py`` was deleted in
      # this PR. The shared tool discovers the repo root via a
      # ``.github/workflows/`` walk-up so it works out-of-the-box.
      - name: Install juniper-ci-tools (workflow-path + agents-md lints)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.2.0,<0.5.0"

      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-workflow-paths

      # Pins AGENTS.md's `**Version**:` header to pyproject.toml's
      # [project].version so version bumps stay in sync with the
      # agent-facing contract. Shipped as the
      # ``juniper-lint-agents-md-version`` console script in
      # ``juniper-ci-tools>=0.3.0`` (juniper-ml#310); the inline
      # byte-identical copy at ``util/test_agents_md_version_drift.py``
      # was deleted in this PR.
      - name: Lint AGENTS.md version vs pyproject.toml
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md version-drift lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-version

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319).
      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Async-route audit (Phase 4 — enforced).
  # Catches the BUG-JD-10 bug class (sync-blocking calls inside async def
  # route handlers). Hard-fails on any new violation. The only intentional
  # sync surface (``src/api/service_launcher.py``, an orchestration helper)
  # carries a per-file-ignore in pyproject.toml [tool.ruff.lint.per-file-ignores].
  # See juniper-ml notes/ASYNC_ROUTE_AUDIT_HOOK_MIGRATION_PLAN.md §4.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  async-route-audit:
    name: Async-route audit (BUG-JD-10 class)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install ruff
        run: pip install "ruff==0.15.6"

      - name: Run async-route audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Async-route audit (BUG-JD-10)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          ruff check --select ASYNC --output-format=github src/

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Unit Tests: Run unit tests with coverage enforcement
  # MED-009: Added Python version matrix for multi-version testing
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests + Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # METRICS-MON R3.7 / seed-(R1.3 design): macOS leg runs in
    # continue-on-error mode for the initial 2-week soak (started
    # 2026-04-30). The Linux legs remain required; the macOS leg
    # surfaces platform-divergence failures (POSIX-only assumptions
    # in the lifecycle / WS / training paths) without blocking PRs
    # while we identify environment-specific issues. After the soak,
    # flip the include block's ``experimental`` flag to false to make
    # the macOS leg required.
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║    Juniper Cascor - Install Dependencies                   ║"
          echo "║    Python ${{ matrix.python-version }} on ${{ matrix.os }} ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          # METRICS-MON R3.7: torch wheel resolution differs by OS.
          # Linux uses the CPU-only PyTorch index to avoid pulling CUDA
          # wheels; macOS finds its native wheels via the default PyPI
          # index — the CPU-only Linux index has no macOS-arm64 wheels.
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          # Install juniper-data-client from git (not yet published to PyPI)
          # juniper-data-client requires Python >=3.12 and is not yet on PyPI
          python -c "import sys; sys.exit(0 if sys.version_info >= (3,12) else 1)" && \
            pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main" || true
          # Install project deps via editable install to keep source-tree
          # path resolution intact (constants resolve config paths via __file__)
          pip install -e ".[all]"

      - name: Create required directories
        run: |
          # ``src/tests/reports`` is required because pyproject.toml's
          # ``[tool.coverage.run] data_file = "src/tests/reports/.coverage"``
          # — pytest-cov silently fails to write its parallel ``.coverage.*``
          # files if the parent dir doesn't exist (gitignored, so absent on
          # fresh CI checkout), which then leaves the Enforce Coverage Gate
          # step with "No data to report".
          mkdir -p logs src/logs reports/junit reports/htmlcov src/tests/reports

      - name: Run Unit Tests
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Unit Tests (Fast Only)              ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "unit and not slow" \
            src/tests/unit \
            --verbose \
            --timeout=60 \
            --maxfail=5 \
            --junitxml=reports/junit/junit-unit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      - name: Enforce Coverage Gate (80%)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Coverage Gate Enforcement           ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m coverage report --fail-under=${COVERAGE_FAIL_UNDER}

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/htmlcov/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Quick Integration Tests: Run on all branches (MED-010)
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  quick-integration-tests:
    name: Quick Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # juniper-data-client requires Python >=3.12 and is not yet on PyPI
          python -c "import sys; sys.exit(0 if sys.version_info >= (3,12) else 1)" && \
            pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main" || true
          pip install -e ".[all]"

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run Quick Integration Tests
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Quick Integration Tests             ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # --integration opts in to integration-marked tests; without it
          # src/tests/conftest.py adds a skip marker to every integration
          # test, which silently turned this entire job into a no-op.
          python -m pytest \
            --integration \
            -m "integration and not slow" \
            src/tests/integration \
            --timeout=60 \
            --maxfail=2 \
            -q \
            --junitxml=reports/junit/junit-quick-integration.xml

      - name: Upload Quick Integration Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: quick-integration-test-results
          path: reports/junit/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Full Integration Tests: Run integration tests (PRs and main/develop pushes only)
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # juniper-data-client requires Python >=3.12 and is not yet on PyPI
          python -c "import sys; sys.exit(0 if sys.version_info >= (3,12) else 1)" && \
            pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main" || true
          pip install -e ".[all]"

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run Integration Tests (Fast Only)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Integration Tests (Fast Only)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # --integration opts in to integration-marked tests; without it
          # src/tests/conftest.py adds a skip marker to every integration
          # test, which silently turned this entire job into a no-op.
          python -m pytest \
            --integration \
            -m "integration and not slow" \
            src/tests/integration \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit/junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Verify package can be built
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install build

      - name: Build package
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Build Package                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Dependency Docs: Generate dependency documentation artifacts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-docs:
    name: Dependency Documentation
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Setup Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          miniforge-version: latest
          # auto-activate-base was renamed to auto-activate in v4 of the
          # action. Miniforge uses `base` as its default env, so no
          # explicit activate-environment is needed.
          auto-activate: true
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Install Dependencies (Dep Docs)     ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # juniper-data-client requires Python >=3.12 and is not yet on PyPI
          python -c "import sys; sys.exit(0 if sys.version_info >= (3,12) else 1)" && \
            pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main" || true
          pip install -e ".[all]"

      # Wave 2 of the dep-docs PyPI migration -- replaces the inline
      # bash scripts/generate_dep_docs.sh with the juniper-ci-tools
      # console script from PyPI. See juniper-ml plan
      # notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md.
      # The inline script will be removed in Wave 4.
      - name: Install juniper-ci-tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.2.0,<0.5.0"

      - name: Generate Dependency Documentation
        shell: bash -l {0}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Generate Dependency Docs            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-generate-dep-docs

      - name: Upload Dependency Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-docs
          path: |
            conf/requirements_ci.txt
            conf/requirements_ci_*.txt
            conf/conda_environment_ci.yaml
            conf/conda_environment_ci_*.yaml
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Security: Run security scans (Gitleaks, Bandit, pip-audit)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [pre-commit]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets Detection)
        # gitleaks-action v2.3.9 explicitly rejects ``repository_dispatch``
        # ("ERROR: The [repository_dispatch] event is not yet supported"),
        # which kills the entire Security Scans job whenever the workflow
        # is triggered by upstream-published events from juniper-data /
        # juniper-cascor-worker. The push/PR triggers cover the
        # human-driven entry points that actually need secret scanning;
        # the dispatch trigger is for ecosystem-fanout test runs and
        # doesn't introduce new commits to scan. Mirrors juniper-data /
        # juniper-canopy.
        if: github.event_name != 'repository_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.3.9 ships as a Node.js 20 action.
          # GitHub forces Node 24 on 2026-06-02; opt in now to eliminate
          # the deprecation warning and ensure continued operation past
          # the cutover. Drop this once gitleaks-action publishes a
          # release pinned to node24 (upstream PR #215).
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        # gitleaks-action v2.3.9 has no `fail` input (passing it triggers
        # "Unexpected input(s) 'fail'" in CI). The action exits non-zero
        # on leaks by default, which is the behavior we want.

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "bandit[sarif]" pip-audit

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST) -> SARIF
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Bandit Security Scan                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # --skip + --exclude mirror the pre-commit `bandit`
          # source-side hook in .pre-commit-config.yaml exactly:
          #   files:   ^src/.*\.py$
          #   exclude: ^src/tests/
          #   --skip:  B101,B301,B311,B403
          # Tests stay in the separate pre-commit "Bandit (relaxed)"
          # hook with a wider skip-list. See V20 in
          # juniper-ml/notes/CI_VALIDATION_FINDINGS_2026-04-29.md.
          # Generate SARIF report (always succeeds for upload)
          bandit -r src --exclude src/tests --skip B101,B301,B311,B403 -f sarif -o reports/security/bandit.sarif --exit-zero
          # Blocking check - fail on medium or higher severity
          bandit -r src --exclude src/tests --skip B101,B301,B311,B403 --confidence-level medium --severity-level medium

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: reports/security/bandit.sarif
        continue-on-error: true

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - pip-audit Dependency Scan           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # Create requirements from pyproject.toml deps for auditing
          pip install torch numpy h5py pyyaml matplotlib
          pip freeze > reports/security/pip-freeze.txt
          # CRIT-005: Fail on high/critical vulnerabilities instead of just warning.
          # ──────────────────────────────────────────────────────────────────────
          # Suppress 11 PyTorch advisories that pip-audit reports against torch
          # 2.12.0 (and the 2.5–2.10 lineage) with **no fix versions available
          # upstream**. All are local-access-required DoS / memory corruption
          # issues in torch internals; none have published fixes as of
          # 2026-05-20. We re-evaluate this list quarterly or when pip-audit's
          # advisory DB syncs a new torch release.
          #
          # PYSEC-2025-189  torch.ops.profiler — memory corruption (local)
          # PYSEC-2025-190  nnq_Sigmoid — improper initialization (local, high complexity)
          # PYSEC-2025-191  mkldnn_max_pool2d — DoS (local, "existence doubted")
          # PYSEC-2025-192  pad_packed_sequence — memory corruption (local)
          # PYSEC-2025-193  unpack_sequence — memory corruption (local)
          # PYSEC-2025-194  torch.jit.script — memory corruption (local)
          # PYSEC-2025-195  torch.lstm_cell — memory corruption (local)
          # PYSEC-2025-196  jit_module_from_flatbuffer — memory corruption (local)
          # PYSEC-2025-197  caching_allocator_delete — memory corruption (local)
          # PYSEC-2025-210  torch.profiler.profile — DoS via missing profiler.stop()
          # PYSEC-2026-139  pt2 Loading Handler — deserialization (local; PR open upstream)
          #
          # Tracking note: when removing IDs, also delete from
          # juniper-cascor-worker's analogous block (kept in sync).
          # ──────────────────────────────────────────────────────────────────────
          pip-audit -r reports/security/pip-freeze.txt --strict --desc on \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            || (echo "::error::Critical/High vulnerabilities found in dependencies" && exit 1)

      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Lockfile Check: Verify requirements.lock matches pyproject.toml
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  lockfile-check:
    name: Lockfile Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Check lockfile freshness
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Lockfile Freshness Check            ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Resolve pyproject.toml using the committed lockfile as constraints.
          # Passes when the pinned versions still satisfy pyproject.toml. Does
          # NOT fail just because newer versions exist on PyPI — that is the
          # whole point of pinning. Fails only when pyproject.toml has drifted
          # from what the lockfile can support: a new dep was added, a min was
          # bumped past a pin, or an entry was removed. Refresh by running:
          #   uv pip compile pyproject.toml \
          #     --extra ml --extra api --extra observability --extra juniper-data \
          #     --index-strategy unsafe-best-match --no-emit-package torch \
          #     --upgrade -o requirements.lock
          uv pip compile pyproject.toml \
            --extra ml \
            --extra api \
            --extra observability \
            --extra juniper-data \
            --index-strategy unsafe-best-match \
            --no-emit-package torch \
            --constraint requirements.lock \
            -o /tmp/requirements.lock.check

          # Compare only the resolved pin lines (pkg==version), ignoring
          # comments. uv's --constraint mode adds "# -c requirements.lock"
          # annotations and the autogenerated header embeds the -o path,
          # both of which would otherwise create false-positive diffs.
          grep '^[^[:space:]#]' requirements.lock | sort > /tmp/lock_pins
          grep '^[^[:space:]#]' /tmp/requirements.lock.check | sort > /tmp/check_pins

          if ! diff -u /tmp/lock_pins /tmp/check_pins; then
            echo ""
            echo "::error::requirements.lock no longer satisfies pyproject.toml — refresh with: uv pip compile pyproject.toml --extra ml --extra api --extra observability --extra juniper-data --index-strategy unsafe-best-match --no-emit-package torch --upgrade -o requirements.lock"
            exit 1
          fi

          echo "::notice::requirements.lock satisfies pyproject.toml ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docker Build & Smoke Test: Verify Dockerfile builds and container starts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # juniper-cascor's runtime ``JUNIPER_DATA_URL`` defaults to
      # ``http://localhost:8100`` and the ``/v1/health/ready`` probe pings
      # ``$JUNIPER_DATA_URL/v1/health/live`` (see src/api/routes/health.py:141).
      # The smoke test therefore needs a juniper-data sidecar reachable on
      # the same Docker network, otherwise readiness returns 503 and the
      # container never reports ``healthy``.
      - name: Clone juniper-data sidecar source
        run: |
          # Cloned to /tmp (outside the workspace) so it doesn't bloat
          # cascor's docker build context.
          git clone --depth 1 https://github.com/pcalnon/juniper-data.git /tmp/juniper-data

      - name: Create Docker network
        run: docker network create juniper-smoke

      - name: Build & start juniper-data sidecar
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Data - Sidecar Build & Start                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker build -t juniper-data:ci-${{ github.sha }} /tmp/juniper-data
          docker run -d --name juniper-data-sidecar \
            --network juniper-smoke \
            --network-alias juniper-data \
            -p 8100:8100 \
            juniper-data:ci-${{ github.sha }}

          echo "Waiting for juniper-data to become healthy..."
          for i in $(seq 1 60); do
            if docker inspect --format='{{.State.Health.Status}}' juniper-data-sidecar 2>/dev/null | grep -q healthy; then
              echo "juniper-data is healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "::error::juniper-data sidecar did not become healthy"
              docker logs juniper-data-sidecar
              exit 1
            fi
            sleep 2
          done

      - name: Build Docker Image
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Docker Build                        ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker build -t juniper-cascor:ci-${{ github.sha }} .

      - name: Verify Container Starts
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Docker Smoke Test                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # Override JUNIPER_DATA_URL so the readiness probe targets the
          # sidecar via its Docker network alias instead of the
          # in-container localhost:8100 default (which would only resolve
          # if cascor and juniper-data ran in the same container — they
          # don't here).
          docker run -d --name juniper-cascor-test \
            --network juniper-smoke \
            -e JUNIPER_DATA_URL=http://juniper-data:8100 \
            -p 8200:8200 \
            juniper-cascor:ci-${{ github.sha }}

          echo "Waiting for juniper-cascor to become healthy..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' juniper-cascor-test 2>/dev/null | grep -q healthy; then
              echo "juniper-cascor is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::juniper-cascor did not become healthy within 30 attempts"
              echo "──── juniper-cascor logs ────"
              docker logs juniper-cascor-test
              echo "──── juniper-data logs ────"
              docker logs juniper-data-sidecar
              exit 1
            fi
            sleep 2
          done

      - name: Verify Package Import
        run: |
          # The wheel publishes as PyPI name ``juniper-cascor`` but the
          # source is laid out as flat modules (``cascade_correlation``,
          # ``api``, ``snapshots``, …) under ``src/``, with no
          # importable top-level ``juniper_cascor`` namespace. Use
          # ``importlib.metadata.version`` to confirm the wheel is
          # installed, then import a real module to confirm it loads.
          docker exec juniper-cascor-test python -c "from importlib.metadata import version; print('juniper-cascor', version('juniper-cascor'))"
          docker exec juniper-cascor-test python -c "import cascade_correlation, api, snapshots; print('modules importable')"

      - name: Verify Health Endpoint
        run: |
          curl -sf http://localhost:8200/v1/health | python3 -m json.tool
          # ``/v1/health/ready`` should now be 200 with juniper_data dep
          # status ``healthy`` thanks to the sidecar.
          curl -sf http://localhost:8200/v1/health/ready | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: |
          docker stop juniper-cascor-test 2>/dev/null || true
          docker rm juniper-cascor-test 2>/dev/null || true
          docker stop juniper-data-sidecar 2>/dev/null || true
          docker rm juniper-data-sidecar 2>/dev/null || true
          docker network rm juniper-smoke 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Required Checks Aggregator: Final quality gate
  # MED-010: Added quick-integration-tests to required checks
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, unit-tests, quick-integration-tests, integration-tests, build, dependency-docs, security, docs, lockfile-check, docker-build]

    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:             ${{ needs.pre-commit.result }}"
          echo "Unit Tests:             ${{ needs.unit-tests.result }}"
          echo "Quick Integration:      ${{ needs.quick-integration-tests.result }}"
          echo "Full Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build:                  ${{ needs.build.result }}"
          echo "Dependency Docs:        ${{ needs.dependency-docs.result }}"
          echo "Security:               ${{ needs.security.result }}"
          echo "Documentation:          ${{ needs.docs.result }}"
          echo "Lockfile Check:         ${{ needs.lockfile-check.result }}"
          echo "Docker Build:           ${{ needs.docker-build.result }}"
          echo ""

          # Pre-commit and unit-tests MUST pass
          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          # Quick integration tests MUST pass (runs on all branches)
          if [[ "${{ needs.quick-integration-tests.result }}" != "success" ]]; then
            echo "::error::Quick integration tests failed"
            exit 1
          fi

          # Build MUST pass
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi

          # Security should pass (but SARIF upload failures are allowed)
          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::error::Security scans failed"
            exit 1
          fi

          # Full integration tests: failure = error, skipped = OK (for feature branches)
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "::error::Full integration tests failed"
            exit 1
          fi

          # Dependency docs: failure = error, skipped = OK (non-blocking)
          if [[ "${{ needs.dependency-docs.result }}" == "failure" ]]; then
            echo "::error::Dependency documentation generation failed"
            exit 1
          fi

          # Documentation link validation must pass
          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          # Lockfile must be fresh (stale lockfile = Docker builds don't match CI)
          if [[ "${{ needs.lockfile-check.result }}" != "success" ]]; then
            echo "::error::Lockfile freshness check failed — requirements.lock is stale"
            exit 1
          fi

          # Docker build: failure = error, skipped = OK (only runs on PRs and main/develop)
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "::error::Docker build and smoke test failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Notify: Build status notification
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [required-checks]
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Build Complete                      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "========== CI/CD Pipeline Summary =============================="
          echo "Status:   ${{ needs.required-checks.result }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Event:    ${{ github.event_name }}"
          echo "================================================================"
