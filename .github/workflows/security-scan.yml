name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "bandit[sarif]" pip-audit
          pip install torch numpy h5py pyyaml matplotlib

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST)
        # --skip + --exclude mirror the pre-commit `bandit` source-side
        # hook in .pre-commit-config.yaml exactly:
        #
        #   files:   ^src/.*\.py$
        #   exclude: ^src/tests/
        #   --skip:  B101,B301,B311,B403
        #     (B101 assert_used; B301 pickle for snapshot serialization;
        #      B311 random for non-crypto sampling; B403 import_pickle)
        #
        # Tests are scanned by the separate "Bandit (relaxed)"
        # pre-commit hook with a wider skip-list (B104/B108/B110/B404/
        # B614 added) — those cases stay out of the CI standalone
        # invocation deliberately. See V20 in
        # juniper-ml/notes/JUNIPER_2026-04-29_JUNIPER-ECOSYSTEM_CI-VALIDATION-FINDINGS.md.
        run: |
          bandit -r src --exclude src/tests --skip B101,B301,B311,B403 -f sarif -o reports/security/bandit.sarif --exit-zero
          bandit -r src --exclude src/tests --skip B101,B301,B311,B403 --confidence-level medium --severity-level medium

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          pip freeze > reports/security/pip-freeze.txt
          pip-audit -r reports/security/pip-freeze.txt --strict --desc on

      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30
