---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCascor
# Application:   juniper_cascor
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.2.0
#
# Date Created:  2026-03-02
# Last Modified: 2026-08-14
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically updates requirements.lock when Dependabot pushes a dependency
#    update to a dependabot/pip/** branch. Runs uv pip compile to regenerate
#    the lockfile and commits the result so Docker builds stay in sync.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-triggers CI.
#
#    Dependabot caveat (2026-07-28): Dependabot-triggered runs use the
#    Dependabot secret store ("Secret source: Dependabot"), so the repo-scoped
#    CROSS_REPO_DISPATCH_TOKEN is EMPTY there and the checkout hard-failed on
#    every dependabot/pip/** push (e.g. run 30346680261 on #426). The
#    token-availability gate below turns that arm into a loud green no-op
#    until the owner registers the same PAT under Settings -> Secrets ->
#    Dependabot, which re-enables full auto-regen with no workflow change.
#    A missing PAT on a NON-Dependabot run still fails loudly. Mirrors
#    juniper-canopy #476.
#
#    required_signatures (2026-08-14, juniper-ml#1099): the 2026-08-12 branch-
#    protection normalization made every repo reject UNSIGNED commits, and a
#    local `git commit` on a runner is unsigned -- so this lane's regen commit
#    turned every branch it touched UNMERGEABLE (an unsigned commit anywhere in
#    the history blocks the merge; squash does not rescue it). The regen now
#    lands through the GitHub API (createCommitOnBranch), which GitHub signs.
#    CROSS_REPO_DISPATCH_TOKEN is still the identity, so the CI re-trigger
#    property is unchanged. Live repro: juniper-cascor#518, where 20/20 checks
#    were green and the PR was BLOCKED solely by this lane's commit.
#
#    release/** exclusion (same change): a release-train proposal PR must stay
#    single-purpose -- version bump + CHANGELOG move. Its pyproject.toml edit is
#    a version bump that cannot change dependency resolution, but it matched the
#    `paths: [pyproject.toml]` filter and dragged unrelated upstream drift
#    (charset-normalizer/filelock/sentry-sdk on #518) into the release PR. The
#    required `Lockfile Freshness` gate is constraint-mode and does NOT fail on
#    newer-upstream-exists, so skipping release/** leaves it green.
#
# References:
#    - Step 7.5.2: Dependency Update Workflow (POLYREPO_MIGRATION_PLAN.md)
#    - juniper-ml#1099 (runner-commit signing), juniper-ml#1096 (propose.py
#      create_signed_commit -- the reference implementation)
#####################################################################################################################################################################################################

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    # Run for:
    #   - any push to a dependabot/pip/** branch (the original trigger), AND
    #   - pull_request events from this repo's own branches (covers
    #     manual pyproject.toml edits — e.g. min-version bumps that
    #     leave main red after merge). Skip PRs from forks since they
    #     cannot push back with our token.
    # Replicates juniper-canopy PR #250 / juniper-data PR #122 hardening.
    #
    # release/** is excluded (juniper-ml#1099): a release-train proposal bumps
    # pyproject.toml's version, which matches the paths filter but cannot change
    # dependency resolution -- regenerating there only smuggles unrelated
    # upstream drift into a PR that must stay single-purpose.
    if: |
      (github.event_name == 'push' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !startsWith(github.head_ref, 'release/'))

    steps:
      - name: Gate on CROSS_REPO_DISPATCH_TOKEN availability
        id: gate
        env:
          # Secrets are not readable in job/step `if:` expressions, so surface
          # presence (never the value) through env for the shell to branch on.
          HAVE_PAT: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          if [[ "${HAVE_PAT}" == "true" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "::notice::CROSS_REPO_DISPATCH_TOKEN is not available to Dependabot-triggered runs (Dependabot secret store). Skipping auto-regen; the Lockfile Freshness CI gate still enforces staleness. Register the PAT under Settings -> Secrets -> Dependabot to re-enable."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is missing for a non-Dependabot run — secret misconfiguration."
            exit 1
          fi

      - name: Checkout Code
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          # For pull_request events, check out the PR head branch (not the
          # merge ref) so the regen commit can be pushed back. ${{ github.ref }}
          # remains correct for push events on dependabot/pip/**.
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.gate.outputs.proceed == 'true'
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Regenerate Lockfile                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          uv pip compile pyproject.toml \
            --extra ml \
            --extra api \
            --extra observability \
            --extra juniper-data \
            --index-strategy unsafe-best-match \
            --no-emit-package torch \
            -o /tmp/requirements.lock.check

          mv /tmp/requirements.lock.check requirements.lock

      # ``requirements-cpu.lock`` (the CONTAINER image's lock) is DERIVED from
      # requirements.lock via ``--constraint``, so regenerating the GPU lock alone
      # drifts it. That is not hypothetical: juniper-cascor-worker's two locks had
      # diverged on 10 of their 19 shared pins by 2026-09-09, and neither repo's CI
      # noticed, because both lock checks assert only that every pyproject dependency
      # is PRESENT in the CPU lock -- never that its version agrees with anything.
      # Re-derive it here, in the same run, and commit BOTH files in the SAME commit
      # below so the pair can never land half-updated.
      - name: Regenerate requirements-cpu.lock (derived from the GPU lock)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor - Regenerate CPU Lockfile             ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # The torch pin lives in the Dockerfile (ARG TORCH_VERSION) and is mirrored in
          # the CPU lock header's recipe; src/tests/unit/test_dockerfile_cpu_torch_pin.py
          # asserts the two agree. Read the operative one and REFUSE if the header
          # disagrees, rather than regenerating against a stale pin and restoring a
          # header that contradicts it.
          TORCH_VERSION="$(sed -n 's/^ARG TORCH_VERSION=//p' Dockerfile)"
          HEADER_VERSION="$(sed -n 's/.*torch==\([0-9][0-9.]*\)+cpu.*/\1/p' requirements-cpu.lock | head -1)"
          if [ -z "${TORCH_VERSION}" ] || [ "${TORCH_VERSION}" != "${HEADER_VERSION}" ]; then
            echo "::error::torch pin mismatch — Dockerfile ARG TORCH_VERSION='${TORCH_VERSION}', requirements-cpu.lock header='${HEADER_VERSION}'. Bump both together, then re-run."
            exit 1
          fi
          echo "torch==${TORCH_VERSION}+cpu" > /tmp/torch-cpu-override

          # Preserve the hand-written header: uv replaces it with its own command line.
          # The header is every leading line before the first pin (the first line starting
          # with neither whitespace nor '#').
          awk '/^[^[:space:]#]/{exit} {print}' requirements-cpu.lock > /tmp/cpu-lock-header
          if [ ! -s /tmp/cpu-lock-header ]; then
            echo "::error::requirements-cpu.lock has no leading comment header — refusing to regenerate and lose the recipe."
            exit 1
          fi

          # Compiled to a fresh path for the same reason the GPU lock above is: uv reads an
          # existing -o file as additional constraints, which silently freezes the bump.
          uv pip compile pyproject.toml \
            --extra ml \
            --extra api \
            --extra observability \
            --extra juniper-data \
            --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --no-emit-package torch \
            --override /tmp/torch-cpu-override \
            --constraint requirements.lock \
            --python-version 3.14 \
            -o /tmp/requirements-cpu.lock.check

          # Everything from the first pin on, dropping uv's own autogenerated header.
          awk 'f || /^[^[:space:]#]/{f = 1; print}' /tmp/requirements-cpu.lock.check > /tmp/cpu-lock-body
          cat /tmp/cpu-lock-header /tmp/cpu-lock-body > requirements-cpu.lock

      # The regen commit is created through the GitHub API rather than by a
      # local `git commit` + `git push`, because GitHub SIGNS API-created
      # commits and the repo now enforces required_signatures (juniper-ml#1099).
      # CROSS_REPO_DISPATCH_TOKEN stays the identity so the resulting commit
      # still re-triggers CI (GITHUB_TOKEN would not).
      - name: Commit updated lockfile (GitHub-signed, via API)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- requirements.lock requirements-cpu.lock; then
            echo "::notice::Lockfiles already up to date — no commit needed"
            exit 0
          fi

          # Both locks go in ONE commit even when only one changed: they are a derived
          # pair, and landing them separately is the drift this step exists to prevent.
          # createCommitOnBranch takes the file's full contents, so an unchanged file is
          # simply rewritten identically — a no-op in the resulting tree.
          git diff --quiet -- requirements.lock \
            && echo "::notice::requirements.lock unchanged" \
            || echo "::notice::requirements.lock updated"
          git diff --quiet -- requirements-cpu.lock \
            && echo "::notice::requirements-cpu.lock unchanged" \
            || echo "::notice::requirements-cpu.lock updated"

          # expectedHeadOid makes this a compare-and-swap: if anything landed on
          # the branch since checkout, the mutation fails loudly rather than
          # clobbering it (the old `git push` had the same protection).
          HEAD_OID=$(git rev-parse HEAD)

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg oid "${HEAD_OID}" \
            --arg contents "$(base64 -w0 requirements.lock)" \
            --arg cpu_contents "$(base64 -w0 requirements-cpu.lock)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "[dependabot skip] Update requirements.lock and requirements-cpu.lock"},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: "requirements.lock", contents: $contents},
                                          {path: "requirements-cpu.lock", contents: $cpu_contents}]}
              }}}' > /tmp/lockfile-commit.json

          gh api graphql --input /tmp/lockfile-commit.json > /tmp/lockfile-commit-result.json

          if jq -e '.errors' /tmp/lockfile-commit-result.json > /dev/null; then
            echo "::error::createCommitOnBranch failed — lockfile NOT committed:"
            jq '.errors' /tmp/lockfile-commit-result.json
            exit 1
          fi

          jq -r '"Signed lockfile commit: " + .data.createCommitOnBranch.commit.url' \
            /tmp/lockfile-commit-result.json
