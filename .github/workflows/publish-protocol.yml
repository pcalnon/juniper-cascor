---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-cascor-protocol (subdirectory of juniper-cascor)
# File Name:     publish-protocol.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-29
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions publish pipeline for the juniper-cascor-protocol package
#    (METRICS-MON R2.2 / seed-05). Triggered by tags matching
#    ``juniper-cascor-protocol-v*`` so it stays decoupled from the
#    juniper-cascor application's own ``v*`` release tags. Publishes to
#    TestPyPI first (with install verification), then PyPI, via OIDC
#    trusted publishing. Mirrors the shape of juniper-ml's
#    publish-observability.yml.
#
#####################################################################################################################################################################################################

name: Publish juniper-cascor-protocol to PyPI

on:
  # Publish ONLY on a cut GitHub Release (the ratified convention — never a bare `git push <tag>`).
  # We deliberately do NOT subscribe to `push: tags`: cutting a Release also creates the tag, which
  # emits a `push: tags` event — subscribing to both fired TWO concurrent publish runs that raced the
  # immutable TestPyPI upload (one uploaded, the other 400'd "file already exists"; see juniper-ml#555).
  # The build job is tag-prefix-guarded below; `release: published` is the single publish path.
  release:
    types: [published]
  # Manual dispatch so operators can re-fire a publish (e.g. after a transient failure).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Belt-and-suspenders serialization keyed on the ref. The primary dedupe is the single
  # `release: published` trigger above (dropping `push: tags` removes the juniper-ml#555 double-fire
  # at the source); this group additionally serializes any residual overlap (e.g. a manual dispatch
  # during a release) so two runs never race the immutable TestPyPI upload concurrently.
  group: publish-protocol-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build + validate the package before publishing
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build and Validate
    # For a `release` event, run only when the release is THIS package's tag. A release for another
    # package in this repo (the cascor app `v*` release, or the sibling `juniper-cascor-model-v*`)
    # also fires this workflow and must be skipped. workflow_dispatch always runs. Downstream jobs
    # `needs: build`, so this one guard gates the whole pipeline.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'juniper-cascor-protocol-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juniper-cascor-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Release-convention gate: a tag-triggered publish only proceeds when a GitHub Release exists
      # for the tag (publish by cutting a Release, never a bare `git push <tag>`). workflow_dispatch
      # skips this as the manual escape hatch.
      - name: Require a GitHub Release for this tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
              echo "GitHub Release found for $tag — proceeding."
              exit 0
            fi
            echo "No GitHub Release for $tag yet — retrying in 5s (attempt $attempt/5)"
            sleep 5
          done
          echo "::error::No GitHub Release exists for tag $tag. Per the release convention, publish by cutting a GitHub Release (gh release create $tag ...), not a bare tag push. Use workflow_dispatch to override."
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: juniper-cascor-protocol-dist
          path: juniper-cascor-protocol/dist/
          if-no-files-found: error
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Publish to TestPyPI first; verify install before promoting to PyPI
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/juniper-cascor-protocol
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: juniper-cascor-protocol-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            juniper-cascor-protocol/pyproject.toml

      - name: Verify install from TestPyPI
        run: |
          set -euo pipefail
          version=$(grep '^version' juniper-cascor-protocol/pyproject.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
          # Release-train Phase 0.2 (finding F-5, policy juniper-ml#384): install
          # juniper-cascor-protocol from TestPyPI ONLY, with --no-deps and no
          # `--extra-index-url https://pypi.org/simple/` fallback. Anti-target-squatting: under
          # --no-deps pip fetches no dependencies, so a pypi.org fallback index could only serve
          # to resolve a squatted same-name TARGET package.
          for attempt in 1 2 3 4 5; do
            if pip install \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "juniper-cascor-protocol==${version}"; then
              break
            fi
            echo "TestPyPI index lag — retrying in 10s (attempt ${attempt}/5)"
            sleep 10
          done
          # `import juniper_cascor_protocol` eagerly loads the numpy BinaryFrame codec (worker
          # subpackage), which is absent under --no-deps; assert the installed distribution and
          # version via importlib.metadata instead of importing the package.
          python -c "import importlib.metadata as m; print('TestPyPI install OK', m.version('juniper-cascor-protocol'))"

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/juniper-cascor-protocol
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: juniper-cascor-protocol-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
          verbose: true
