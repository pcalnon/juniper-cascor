---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-cascor-model (subdirectory of juniper-cascor)
# File Name:     ci-cascor-model.yml
# Author:        Paul Calnon
#
# Date Created:  2026-06-14
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-cascor-model package (CW-05 candidate-core,
#    relocated from juniper-ml per the package placement plan). Runs on PRs
#    and pushes that touch the package or this workflow. Installs CPU torch
#    (the candidate core needs torch) and runs the package's own tests,
#    including the src drift-guard (tests/test_drift.py). The juniper-cascor
#    application's own ci.yml continues to gate the server; this workflow
#    handles the package lifecycle independently (mirrors ci-protocol.yml).
#
#####################################################################################################################################################################################################

name: CI — juniper-cascor-model

on:
  push:
    branches: [main]
    paths:
      - "juniper-cascor-model/**"
      - ".github/workflows/ci-cascor-model.yml"
  pull_request:
    branches: [main]
    paths:
      - "juniper-cascor-model/**"
      - ".github/workflows/ci-cascor-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: juniper-cascor-model
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch + package + test extras
        run: |
          pip install --upgrade "pip>=26.1.1"
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[test]"

      - name: Run unit tests (incl. src drift-guard)
        run: python -m pytest -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-cascor-model
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*
