---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-cascor-protocol (subdirectory of juniper-cascor)
# File Name:     ci-protocol.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-29
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-cascor-protocol package (METRICS-MON
#    R2.2 / seed-05). Runs on PRs and pushes that touch the package or
#    its tests. The juniper-cascor application's own ci.yml continues
#    to gate the server; this workflow handles the protocol-package
#    lifecycle independently per design §6 Q6.
#
#####################################################################################################################################################################################################

name: CI — juniper-cascor-protocol

on:
  push:
    branches: [main]
    paths:
      - "juniper-cascor-protocol/**"
      - ".github/workflows/ci-protocol.yml"
  pull_request:
    branches: [main]
    paths:
      - "juniper-cascor-protocol/**"
      - ".github/workflows/ci-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The Python 3.15 leg is INFORMATIONAL: phase 1 of the ecosystem's 3.15
    # migration (Overtoad request, 2026-11-14) runs it so its results show,
    # but it must block nothing. It is the only leg with
    # ``experimental: true``, so this expression is true on it alone: a
    # failure there leaves this job's result at success, so `build`
    # (`needs: test`) still runs, and no ruleset requires its context.
    # Same pattern as ci.yml's unit-tests job, measured on
    # juniper-data#538 (run 43655144734). Keep it until the Overtoad makes
    # 3.15 a required version (phase 3 of the migration).
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.15"
            experimental: true
    defaults:
      run:
        working-directory: juniper-cascor-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        continue-on-error: ${{ matrix.experimental == true }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: setup-python
        continue-on-error: ${{ matrix.experimental == true }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        id: install-package-test-extras
        continue-on-error: ${{ matrix.experimental == true }}
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test]"

      - name: Run unit tests with coverage
        id: run-unit-tests-with-coverage
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          python -m pytest --cov=juniper_cascor_protocol --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=95

      - name: Enforce per-file coverage gate (blocking)
        id: enforce-per-file-coverage-gate-blocking
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

      - name: Report the informational Python 3.15 result
        # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration). On the 3.15 leg every step above
        # carries `continue-on-error: ${{ matrix.experimental == true }}`, so a failing step neither stops
        # this job nor turns its check red, and no merge, push or deployment waits on it. This step says
        # what failed instead: a warning annotation, and a table in the job summary.
        if: always() && matrix.experimental == true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PY_LEG: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS_JSON"])
          leg = os.environ["PY_LEG"]
          failed = [k for k, v in steps.items() if v.get("outcome") not in ("success", "skipped")]
          rows = "\n".join(f"| `{k}` | {v.get('outcome')} |" for k, v in steps.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Python {leg}: informational, blocks nothing\n\n| Step | Outcome |\n|---|---|\n{rows}\n")
          if failed:
              print(f"::warning title=Python {leg} (informational)::{len(failed)} step(s) failed on Python {leg}: {', '.join(failed)}. Nothing is blocked; see this job's summary.")
          else:
              print(f"::notice title=Python {leg} (informational)::every step passed on Python {leg}")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-cascor-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*
