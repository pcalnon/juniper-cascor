---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-cascor-protocol (subdirectory of juniper-cascor)
# File Name:     ci-protocol.yml
# Author:        Paul Calnon
#
# Date Created:  2026-04-29
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-cascor-protocol package (METRICS-MON
#    R2.2 / seed-05). Runs on PRs and pushes that touch the package or
#    its tests. The juniper-cascor application's own ci.yml continues
#    to gate the server; this workflow handles the protocol-package
#    lifecycle independently per design §6 Q6.
#
#####################################################################################################################################################################################################

name: CI — juniper-cascor-protocol

on:
  push:
    branches: [main]
    paths:
      - "juniper-cascor-protocol/**"
      - ".github/workflows/ci-protocol.yml"
  pull_request:
    branches: [main]
    paths:
      - "juniper-cascor-protocol/**"
      - ".github/workflows/ci-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: juniper-cascor-protocol
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          python -m pytest --cov=juniper_cascor_protocol --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=95

      - name: Enforce per-file coverage gate (blocking)
        run: |
          pip install "juniper-ci-tools>=0.6.0,<0.7.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-cascor-protocol
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*
