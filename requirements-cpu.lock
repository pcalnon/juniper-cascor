# CPU-only lock for the juniper-cascor CONTAINER IMAGE (container-registry rollout, Wave 2).
#
# This lock is ``requirements.lock`` MINUS the CUDA stack. It pins everything the service
# image needs EXCEPT torch, which the Dockerfile installs separately from the PyTorch CPU
# index (https://download.pytorch.org/whl/cpu), pinned to the +cpu version named below.
# ``requirements.lock`` cannot serve the image: it was resolved against the CUDA torch on
# PyPI, so it pins nvidia-cublas / nvidia-cudnn-cu13 / nvidia-nccl-cu13 / triton /
# cuda-toolkit and friends OUTRIGHT -- ~3 GB that `pip install -r` installs whether or
# not torch wants them, on an image that is CPU-only by design (plan D-5) and must run
# on Raspberry Pi nodes. The pins shared with requirements.lock are IDENTICAL by
# construction (``--constraint requirements.lock`` below), so the image and a GPU dev
# install differ only in torch's build and the absence of the nvidia-*/triton wheels.
#
# Regeneration command (run from the repo root, AFTER requirements.lock is current):
#   echo "torch==2.14.0+cpu" > /tmp/torch-cpu-override
#   uv pip compile pyproject.toml \
#     --extra ml --extra api --extra observability --extra juniper-data \
#     --index-strategy unsafe-best-match \
#     --extra-index-url https://download.pytorch.org/whl/cpu \
#     --no-emit-package torch \
#     --override /tmp/torch-cpu-override \
#     --constraint requirements.lock \
#     --python-version 3.14 \
#     -o requirements-cpu.lock
#   (then restore this header: uv overwrites it with the command line)
#
# The torch pin here MUST equal ``ARG TORCH_VERSION`` in the Dockerfile --
# src/tests/unit/test_dockerfile_cpu_torch_pin.py fails otherwise. Bump both together,
# and re-run the command above so torch's own transitive pins (setuptools, sympy,
# networkx, ...) move with it. The +cpu local-version segment is what makes uv resolve
# against the CPU wheel, whose metadata declares no nvidia-* dependencies at all.
#
# CI: `Lockfile Freshness` asserts every name-form dependency of pyproject.toml (base +
# the four extras above, torch excepted) is pinned here, so a dependency added to
# pyproject but not re-locked here fails the build rather than the container at import.
