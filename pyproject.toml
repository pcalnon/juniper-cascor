#
# Description:
#    Python project configuration for Juniper Cascor
#    Configures Black, isort, pytest, coverage, and mypy
#
# References:
#    - CASCOR-P1-007: CI/CD Pipeline Setup
#    - CASCOR-P2-002: Type Checker Configuration
#####################################################################################################################################################################################################

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
exclude = ["tests*", "backups*"]

[project]
name = "juniper-cascor"
version = "0.8.0"
description = "Cascade Correlation Neural Network implementation for the Juniper project"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Calnon" }]
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    # CFG-02 (v7 roadmap §13524): ``sentry-sdk`` was previously a core
    # dependency here. It is now declared in the [observability]
    # optional-dependencies extra (mirrors juniper-canopy's pattern
    # and juniper-observability's own [sentry] extra). Bootstrap init
    # at ``src/main.py`` lazy-imports the SDK only when
    # ``JUNIPER_CASCOR_SENTRY_DSN`` (or the deprecated ``SENTRY_SDK_DSN``)
    # is set, with try/except ImportError so non-observability installs
    # don't crash. The shared ``juniper_observability.configure_sentry``
    # (called from ``src/api/app.py``) already imports sentry_sdk lazily
    # inside the function and is a no-op when DSN is empty.
    "python-dotenv>=1.0.0",
    # METRICS-MON R2.1.4 / seed-06: shared observability primitives
    # (DependencyStatus, ReadinessResponse, probe_dependency,
    # JuniperJsonFormatter, RequestIdMiddleware, PrometheusMiddleware,
    # configure_sentry, get_prometheus_app, set_build_info, and the
    # R1.1/R1.2/R1.3 contract constants). 0.3.0 added
    # ``MetricsAuthMiddleware`` + ``parse_trusted_networks`` +
    # ``normalize_client_ip`` + ``METRICS_DEFAULT_TRUSTED_IPS`` +
    # ``TrustedNetwork`` so this module can drop its inline copy.
    # 0.3.1 added the ``logging.warning`` on unparseable client IP
    # that cascor had been carrying inline since #313 — pin >=0.3.1
    # so the warning is preserved post-migration. 0.4.0 added optional
    # ``git_sha`` / ``build_date`` passthrough on ``set_build_info`` +
    # the shared ``ReadinessResponse`` model for build provenance
    # (juniper-ml notes/BUILD_PROVENANCE_DESIGN_2026-06-14.md).
    "juniper-observability>=0.4.0",
    # METRICS-MON R2.2.2 / seed-05: WebSocket frame schemas (envelope
    # Pydantic models for /ws/training and /ws/control + WorkerMessageType
    # StrEnum + BinaryFrame numpy codec for /ws/v1/workers). The cascor
    # server is the first consumer of its own protocol package, so the
    # source of truth lives in juniper-cascor-protocol and the server
    # imports it. Promotion to >=0.1.0 stable follows the alpha soak.
    "juniper-cascor-protocol>=0.1.0a0",
    # WS-6 B-phase (native model-core adoption): the production CascorModel
    # wrapper (src/api/models/cascor_model.py) imports juniper_model_core at
    # module load, so the abstract model interface is now a runtime dependency
    # of the cascor service (not test-only). Pin matches the [test] conformance
    # kit (OQ-B2, plan §9): >=0.2.0,<0.3.0; model-core has zero deps / no torch.
    "juniper-model-core>=0.2.0,<0.4.0",
    # SEC-F01 / HO-2 (per-service adoption wave): boot-time auth-posture
    # self-check. The lifespan calls enforce_auth_posture with the resolved
    # inbound api_keys right after the bind-attestation guard, so an
    # empty/placeholder JUNIPER_CASCOR_API_KEYS secret (which silently
    # disables APIKeyAuth and serves protected routes open behind a healthy
    # health check) is loud at boot. Stdlib-only import surface; 0.5.0 is the
    # release that ships the check. Pin mirrors the model-core floor+cap style.
    "juniper-service-core>=0.5.0,<0.6.0",
]

[project.optional-dependencies]
ml = [
    # SEC-F17 (CVE-2025-3001, lstm_cell memory corruption, fixed 2.10.0):
    # floor raised 2.0.0 -> 2.10.0 to exclude the vulnerable 2.0-2.9 range.
    "torch>=2.10.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0",
    "PyYAML>=6.0",
]
juniper-data = [
    "juniper-data-client>=0.3.0; python_version>='3.12'",
    "juniper-data>=0.4.0; python_version>='3.12'",
]
api = [
    "fastapi>=0.100.0",
    # CVE-2026-48710 (GHSA-86qp-5c8j-p5mr): Host-header poisoning of
    # request.url.path bypasses path-based security checks in starlette
    # <=1.0.0. Floor at 1.0.1 (the patched version) so transitive
    # resolution can never select a vulnerable starlette via fastapi.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.20.0",
    "pydantic-settings>=2.0.0",
]
observability = [
    "prometheus-client>=0.20.0",
    # CFG-02 (v7 roadmap §13524): moved here from [project] dependencies.
    # Bare ``sentry-sdk>=2.0.0`` (no [fastapi] extra) matches the canopy
    # precedent. The shared ``juniper-observability[sentry]`` extra pins
    # ``sentry-sdk[fastapi]>=2.0.0``; aligning with that floor is a
    # deferred follow-up — CFG-02 is scoped strictly to moving the dep.
    "sentry-sdk>=2.0.0",
]
test = [
    "pytest>=6.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "coverage[toml]",
    "dill>=0.3.6",
    "responses>=0.23.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    # OUT-13 (WS-6 gate, half 2): the model-core conformance kit. Test-only —
    # CascadeCorrelationNetwork is run through juniper_model_core.conformance
    # via a test adapter (src/tests/conformance/). Pulls numpy (already present).
    "juniper-model-core[conformance]>=0.2.0,<0.4.0",
]
# CLN-CC-10: dill is required by utils.check_object_pickleability, a
# debugging helper for diagnosing multiprocessing pickle failures. It is
# also shipped in the [test] extra; this extra exists so users can opt in
# without pulling the full test stack.
debug = [
    "dill>=0.3.8",
]
all = [
    "juniper-cascor[ml,api,observability,test,debug,juniper-data]",
]

[tool.black]
line-length = 512
target-version = ["py312", "py313"]

include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.pytest_cache
    | \.trunk
    | __pycache__
    | data
    | logs
    | reports
    | htmlcov
    | images
)/
'''
#
[tool.isort]
profile = "black"
line_length = 512
skip = [".git", "__pycache__", ".pytest_cache", ".trunk", "data", "logs", "reports", "htmlcov"]
skip_glob = ["*/data/*", "*/logs/*", "*/reports/*"]
known_first_party = ["cascade_correlation", "candidate_unit", "spiral_problem", "snapshots", "log_config", "constants", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--continue-on-collection-errors",
    "--tb=short",
    # Block pytest plugins whose entrypoints get auto-discovered from the
    # active env even when this project does not use them. dash.testing.plugin
    # transitively imports psutil; if the env's psutil wheel is built for the
    # wrong CPython ABI (e.g. a non-FT abi3 wheel landing in a python3.14t env),
    # the dash plugin import segfaults during pytest startup before the
    # free-threading guard in src/tests/conftest.py can fire. pytest_playwright
    # is similarly autoloaded and breaks when `playwright` is not installed.
    "-p", "no:dash",
    "-p", "no:playwright",
]
# MED-007: Targeted warning filters instead of suppressing all warnings
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::PendingDeprecationWarning:h5py.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:google.*",
    # Ignore pytest internal warnings
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Third-party: Starlette TestClient timeout deprecation
    "ignore::DeprecationWarning:starlette.*",
    # Third-party: sentry-sdk uses deprecated asyncio.iscoroutinefunction (Python 3.14+)
    "ignore::DeprecationWarning:sentry_sdk.*",
    # matplotlib non-interactive backend warning in headless test environments
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full workflows",
    "performance: Performance and benchmarking tests",
    "slow: Tests that take a long time to run",
    "long: Long-running correctness tests (use --run-long to run)",
    "gpu: Tests that require GPU/CUDA",
    "multiprocessing: Tests that use multiprocessing",
    "spiral: Tests specifically for spiral problem solving",
    "correlation: Tests for correlation coefficient calculations",
    "network_growth: Tests for network growth algorithms",
    "candidate_training: Tests for candidate unit training",
    "validation: Tests for input validation functions",
    "accuracy: Tests for accuracy calculation methods",
    "early_stopping: Tests for early stopping logic",
    "requires_juniper_data: Tests that require the juniper-data package to be installed",
    "critical: Tests covering business-critical paths (used as a tag, not a selector)",
    "golden: Golden/snapshot regression tests pinning deterministic training trajectories, serialization round-trips, and API response shapes (OUT-12 / WS-6 pre-refactor gate; --golden, serial-only)",
    "conformance: model-core interface-conformance tests running CascadeCorrelationNetwork through the juniper-model-core conformance kit (OUT-13 / WS-6 gate half 2; --conformance, serial-only)",
]
timeout = 60
# Thread-based timeout avoids SIGALRM interference with forkserver IPC
# in multiprocessing-heavy performance tests. Signal-based timeout can
# deadlock the forkserver's pipe/socket operations.
timeout_method = "thread"

[tool.coverage.run]
# MED-001: Expanded to cover all source directories
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/data/*",
    "*/logs/*",
]
branch = true
# Explicit data file path to prevent sqlite3.OperationalError when
# coverage attempts to write parallel data files to the working directory.
data_file = "src/tests/reports/.coverage"
parallel = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "src/tests/reports/htmlcov"

[tool.coverage.xml]
output = "src/tests/reports/coverage.xml"

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "^data/",
    "^logs/",
    "^reports/",
    "^htmlcov/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "h5py.*",
    "matplotlib.*",
    "yaml.*",
]
ignore_missing_imports = true


# ═══════════════════════════════════════════════════════════════════════════
# Ruff — async-route audit only (Phase 1 wiring, disabled state).
# Cascor's primary lint stack stays flake8 + black + isort + bandit + mypy.
# Ruff is added solely for the ASYNC* ruleset (BUG-JD-10 class prevention),
# enforced via a manual-stage pre-commit hook. See juniper-ml notes/
# ASYNC_ROUTE_AUDIT_HOOK_MIGRATION_PLAN.md.
# ═══════════════════════════════════════════════════════════════════════════
[tool.ruff]
# Note: ruff >=0.15 caps line-length at 320. Cascor's ecosystem
# convention is 512, but since this ruff config is only used for the
# ASYNC* ruleset (not formatting), the value doesn't affect output;
# pinned at the 320 cap so the config parses without error.
line-length = 320
target-version = "py312"

[tool.ruff.lint]
# Empty `select` so regular `ruff check` is a no-op. The ASYNC* ruleset is
# explicitly opted into via the pre-commit hook's `--select ASYNC` arg.
# Phase 4 may flip this to `select = ["ASYNC"]` if we want the rules
# applied during regular runs too.
select = []

[tool.ruff.lint.per-file-ignores]
# Phase 0 enumeration (juniper-ml notes/ASYNC_ROUTE_VIOLATIONS_2026-05-06.md)
# flagged 4 violations in this file. They're all intentional — the file is
# a service orchestration helper that spawns subprocesses, polls health
# endpoints, and writes log files. Sync I/O is the whole point of these
# functions; the async wrapper is for orchestration concurrency, not
# request handling. Per-file-ignored so the ruff-async-audit hook doesn't
# surface them as Phase 3 cleanup candidates.
# why: orchestration helper, not a route handler
"src/api/service_launcher.py" = ["ASYNC109", "ASYNC210", "ASYNC220", "ASYNC230"]
