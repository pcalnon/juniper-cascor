# spiral-smoke — the P1.1 smoke configuration, live-proven 2026-08-07 (exit 0, COMPLETED 24s;
# evidence: juniper-ml notes/JUNIPER_2026-08-07_JUNIPER-ECOSYSTEM_CLI-EXPERIMENTATION-P1-SMOKE-EVIDENCE.md).
# Minimal budgets for a fast end-to-end sanity run of the launcher + driver + plots + stats.
schema_version: 1
experiment:
  name: spiral-smoke
  description: "P1.1 minimal-budget spiral smoke (launcher + driver end-to-end)"
  seed: 20260807

service:
  log_level: INFO
  metrics_enabled: true
  auto_start: false
  auto_start_data_service: false

dataset:
  generator: spiral
  params:
    n_spirals: 2
    n_points_per_spiral: 200
    n_rotations: 2.0
    noise: 0.05
    train_ratio: 0.8
    test_ratio: 0.2
    seed: 20260807

training:
  params:
    # `output_epochs` MUST accompany `max_epochs`, and must match it. On the SERVICE path
    # `max_epochs` bounds only the INITIAL output pass; every later pass reads `output_epochs`,
    # which falls back to `_PROJECT_MODEL_OUTPUT_EPOCHS = 10000`
    # (src/cascor_constants/constants_model/constants_model.py:300). The direct CLI instead
    # ALIASES `max_epochs -> output_epochs` (src/main.py:299), so the two paths silently diverge
    # and the service arm runs better-trained and slower than the config appears to ask for.
    #
    # Measured 2026-09-02 at this file's (10, 10) override -- the budget PF-1 uses:
    #   without output_epochs : drive 65-126 s, 4012 steps   <- later passes at the 10000 fallback
    #   with output_epochs 50 : drive 15.1 s,    32 steps
    # i.e. the service was doing ~125x the work this file asks for. Confirmed from run evidence,
    # not just source: `output_epoch` history rows reach epoch 10000 even at the NATIVE (2, 2)
    # budget, for BOTH non-initial passes.
    max_epochs: 50
    output_epochs: 50
    max_iterations: 2
    max_hidden_units: 2
    candidate_pool_size: 4
    early_stopping: true

runtime:
  blas_threads: 2

outputs:
  plots: [dataset, decision_boundary, training_history]
  metrics_history_count: 500
  max_wall_seconds: 600
  grafana_bridge: true
