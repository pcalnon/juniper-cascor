# xor-staged — a non-spiral reference showing the G-6 staging path (CLI experimentation plan §6.3/§10.3).
# Non-spiral generators are REJECTED 422 on POST /v1/training/start (W-1); the driver stages them via
# POST /v1/training/dataset instead and asserts the loaded input width after the run (G-6 anti-silence).
schema_version: 1
experiment:
  name: xor-staged
  description: "XOR quadrants via the staging path, small budgets, boundary plot"
  seed: 20260807

service:
  log_level: INFO
  metrics_enabled: true
  auto_start: false
  auto_start_data_service: false

dataset:
  generator: xor                       # staged as dataset_type "xor" (driver alias map)
  params:
    n_points_per_quadrant: 250
    noise: 0.05
    seed: 20260807

training:
  params:
    # `output_epochs` MUST accompany `max_epochs`, and must match it. On the SERVICE path
    # `max_epochs` bounds only the INITIAL output pass; every later pass reads `output_epochs`,
    # which falls back to `_PROJECT_MODEL_OUTPUT_EPOCHS = 10000`. The direct CLI instead ALIASES
    # `max_epochs -> output_epochs`, so without both keys the two paths silently diverge and the
    # service arm runs ~50x the work this file asks for.
    #
    # Set to 200/200 on 2026-09-07 (owner decision, juniper-ml P2 item 0.5). This file describes
    # itself as "small budgets"; the split contradicted that, and unlike `spiral-baseline.yaml`
    # -- whose split is a documented service-only reference budget -- there was no rationale for
    # it here. The same defect survived a month in `spiral-smoke.yaml` before cascor#618.
    max_epochs: 200
    output_epochs: 200
    max_iterations: 4
    max_hidden_units: 6
    candidate_pool_size: 4
    early_stopping: true

runtime:
  blas_threads: 2

outputs:
  plots: [dataset, decision_boundary, training_history]
  metrics_history_count: 500
  max_wall_seconds: 1200
  grafana_bridge: true
