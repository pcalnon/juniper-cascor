---
extends: default

rules:
  line-length:
    max: 320
    level: warning
  document-start: disable
  comments-indentation: disable
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

# conf/conda_environment_ci.yaml is generated by scripts/generate_dep_docs.sh
# using conda's explicit-list format (YAML preamble + bare package-URL list);
# bare URLs after `dependencies:` make it invalid as pure YAML. Same for the
# timestamped variants. No-op under the pre-commit hook's `-d relaxed` override
# (the exclude is enforced via .pre-commit-config.yaml) but useful for direct
# yamllint invocation.
ignore: |
  .venv/
  venv/
  __pycache__/
  .pytest_cache/
  .mypy_cache/
  data/
  logs/
  reports/
  conf/conda_environment_ci.yaml
  conf/conda_environment_ci_*.yaml
